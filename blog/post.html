<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">loading&hellip; — Susanket</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>

<div class="topbar">
  <nav>
    <a href="../index.html">home</a>
    <a href="index.html" class="current">blog</a>
    <a href="../photography/index.html">gallery</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">* light</button>
</div>

<main class="wrap">
  <div class="post-header">
    <a class="back" href="index.html">&larr; back to blog</a>
    <div id="post-header-content">
      <p class="loading">loading post&hellip;</p>
    </div>
  </div>

  <article class="post-body" id="post-body"></article>

  <div class="post-footer">
    <a class="link" href="index.html">&larr; all posts</a>
  </div>
</main>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/starfield.js"></script>
<script src="../assets/js/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get("slug");
  var headerEl = document.getElementById("post-header-content");
  var bodyEl = document.getElementById("post-body");

  function fmtDate(iso) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  }

  function readingTime(text) {
    var words = text.trim().split(/\s+/).length;
    return Math.max(1, Math.round(words / 220));
  }

  function fail(msg) {
    headerEl.innerHTML = '<p class="loading">' + msg + "</p>";
  }

  function htmlToText(src) {
    var doc = new DOMParser().parseFromString(src, "text/html");
    var junk = doc.querySelectorAll("script, style, svg");
    for (var i = 0; i < junk.length; i++) junk[i].parentNode.removeChild(junk[i]);
    return doc.body ? doc.body.textContent || "" : "";
  }

  function renderHeader(meta, text) {
    document.getElementById("doc-title").textContent = meta.title + " \u2014 Susanket";
    var tags = (meta.tags || []).join(" &middot; ");
    headerEl.innerHTML =
      "<h1>" + escapeHtml(meta.title) + "</h1>" +
      '<p class="post-meta">' + fmtDate(meta.date) + " &middot; " + readingTime(text) + " min read" + (tags ? " &middot; " + tags : "") + "</p>";
  }

  function activateScripts(container) {
    var scripts = Array.prototype.slice.call(container.querySelectorAll("script"));
    scripts.forEach(function (old) {
      var s = document.createElement("script");
      for (var i = 0; i < old.attributes.length; i++) {
        s.setAttribute(old.attributes[i].name, old.attributes[i].value);
      }
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }

  function renderHtmlPost(src) {
    bodyEl.classList.add("post-body-html");
    bodyEl.innerHTML = src;
    activateScripts(bodyEl);
  }

  function renderMarkdownPost(md) {
    var renderer = new marked.Renderer();

    renderer.image = function(token) {
      var h = escapeHtml(token.href);
      var t = escapeHtml(token.text || '');
      return '<figure><img src="' + h + '" alt="' + t + '">' +
             '<figcaption>' + t + '</figcaption></figure>';
    };

    renderer.link = function(token) {
      var href = token.href;
      var text = this.parser.parseInline(token.tokens);
      var domain = '';
      try { domain = new URL(href).hostname.replace(/^www\./, ''); }
      catch(e) { domain = href; }
      var h = escapeHtml(href);
      var t = escapeHtml(text || href);
      var d = escapeHtml(domain);
      return '<a href="' + h + '" class="link-button" target="_blank" rel="noopener">' +
             '<span class="link-domain">' + d + '</span></a>';
    };

    marked.use({ renderer: renderer });

    var displayMath = [];
    var inlineMath = [];

    md = md.replace(/\$\$([\s\S]*?)\$\$/g, function(_, math) {
      var i = displayMath.length;
      displayMath.push(math);
      return 'DSPMATH' + i + 'DSPEND';
    });

    md = md.replace(/\$(?!\$)([\s\S]*?)\$(?!\$)/g, function(_, math) {
      var i = inlineMath.length;
      inlineMath.push(math);
      return 'INLMATH' + i + 'INLEND';
    });

    var html = marked.parse(md);

    html = html.replace(/DSPMATH(\d+)DSPEND/g, function(_, i) {
      return '$$' + displayMath[parseInt(i)] + '$$';
    });
    html = html.replace(/INLMATH(\d+)INLEND/g, function(_, i) {
      return '$' + inlineMath[parseInt(i)] + '$';
    });

    bodyEl.innerHTML = html;

    renderMathInElement(bodyEl, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }

  function slugify(str) {
    return String(str).toLowerCase().trim()
      .replace(/[^\w]+/g, "-")
      .replace(/^-+|-+$/g, "") || "section";
  }

  function headingText(h) {
    var clone = h.cloneNode(true);
    var strip = clone.querySelectorAll(".sec-num, .no");
    for (var i = 0; i < strip.length; i++) strip[i].parentNode.removeChild(strip[i]);
    return clone.textContent.trim();
  }

  function buildToc() {
    var old = document.querySelector(".toc-rail");
    if (old) old.parentNode.removeChild(old);

    var all = Array.prototype.slice.call(bodyEl.querySelectorAll("h2, h3, h4"))
      .filter(function (h) { return headingText(h); });
    if (all.length < 2) return;

    function levelOf(h) { return parseInt(h.tagName.charAt(1), 10); }
    var baseLevel = 4;
    all.forEach(function (h) { baseLevel = Math.min(baseLevel, levelOf(h)); });

    var heads = all.filter(function (h) { return levelOf(h) <= baseLevel + 1; });
    if (heads.length < 2) return;

    heads.forEach(function (h) {
      var base = slugify(headingText(h));
      var id = h.id || base;
      var n = 2;
      while (document.getElementById(id) && document.getElementById(id) !== h) {
        id = base + "-" + n++;
      }
      h.id = id;
    });

    var nav = document.createElement("nav");
    nav.className = "toc-rail";
    nav.setAttribute("aria-label", "On this page");

    var postTitle = document.querySelector(".post-header h1");
    var titleText = postTitle ? postTitle.textContent.trim() : "";
    if (titleText) {
      var top = document.createElement("div");
      top.className = "toc-item toc-top";
      var topLabel = document.createElement("span");
      topLabel.className = "toc-label";
      topLabel.textContent = titleText;
      var topBar = document.createElement("span");
      topBar.className = "toc-bar";
      top.appendChild(topLabel);
      top.appendChild(topBar);
      nav.appendChild(top);
    }

    var items = heads.map(function (h) {
      var text = headingText(h);
      var a = document.createElement("a");
      a.className = "toc-item" + (levelOf(h) > baseLevel ? " sub" : "");
      a.href = "#" + h.id;
      a.setAttribute("aria-label", text);

      var label = document.createElement("span");
      label.className = "toc-label";
      label.textContent = text;

      var bar = document.createElement("span");
      bar.className = "toc-bar";
      bar.style.width = Math.max(8, Math.min(20, 8 + text.length * 0.3)) + "px";

      a.appendChild(label);
      a.appendChild(bar);
      a.addEventListener("click", function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: "smooth", block: "start" });
        if (history.replaceState) history.replaceState(null, "", "#" + h.id);
      });
      nav.appendChild(a);
      return a;
    });

    document.body.appendChild(nav);

    var hideTimer;
    function openRail() {
      clearTimeout(hideTimer);
      nav.classList.add("open");
    }
    function closeRail() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { nav.classList.remove("open"); }, 250);
    }
    nav.addEventListener("mouseenter", openRail);
    nav.addEventListener("mouseleave", closeRail);
    nav.addEventListener("focusin", openRail);
    nav.addEventListener("focusout", closeRail);

    function setActive(id) {
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle("active", items[i].getAttribute("href") === "#" + id);
      }
    }

    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        ticking = false;
        var cur = heads[0];
        for (var i = 0; i < heads.length; i++) {
          if (heads[i].getBoundingClientRect().top <= 160) cur = heads[i];
        }
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
          cur = heads[heads.length - 1];
        }
        setActive(cur.id);
      });
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    onScroll();
  }

  function insertHeaderImage(meta) {
    var headerSrc = meta.headerImage;
    var headerCap = meta.headerCaption;
    if (!headerSrc) return;
    var hDiv = document.createElement('div');
    hDiv.className = 'post-header-image-wrap';
    hDiv.innerHTML =
      '<img src="' + escapeHtml(headerSrc) + '" alt="' + escapeHtml(headerCap || '') + '">' +
      (headerCap ? '<span class="img-caption">' + escapeHtml(headerCap) + '</span>' : '');
    bodyEl.parentNode.insertBefore(hDiv, bodyEl);
  }

  if (!slug) {
    fail("no post specified.");
  } else {
    fetch("../content/posts/manifest.json")
      .then(function (r) {
        if (!r.ok) throw new Error("manifest not found");
        return r.json();
      })
      .then(function (data) {
        var meta = (data.posts || []).find(function (p) { return p.slug === slug; });
        if (!meta || meta.published === false) throw new Error("post not found");

        var isHtml = meta.format === "html";
        var ext = isHtml ? ".html" : ".md";

        return fetch("../content/posts/" + slug + ext)
          .then(function (r) {
            if (!r.ok) throw new Error((isHtml ? "html" : "markdown") + " file missing for this post");
            return r.text();
          })
          .then(function (src) {
            renderHeader(meta, isHtml ? htmlToText(src) : src);
            if (isHtml) renderHtmlPost(src);
            else renderMarkdownPost(src);
            insertHeaderImage(meta);
            buildToc();
          });
      })
      .catch(function (err) {
        fail("couldn\u2019t load this post (" + escapeHtml(err.message) + "). If you just opened this file directly, run a local server \u2014 see the README.");
      });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>
<script src="../assets/js/favicon.js"></script>
</body>
</html>
